name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e .; fi
          pip install pytest

      - name: Unit tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "No tests/ directory yet"; fi

      - name: Build fixture repos (each scenario checks itself)
        run: python test-fixtures/generate_fixtures.py

      - name: Self-test the test harness
        run: python test-fixtures/run_tests.py --self-test

      - name: Run fixture tests against the tool
        run: |
          if [ ! -x tool-adapter.sh ]; then
            echo "::warning::tool-adapter.sh not found — skipping tool tests (see test-fixtures/tool-adapter.example.sh)"
            exit 0
          fi
          python test-fixtures/run_tests.py \
            --tool "$GITHUB_WORKSPACE/tool-adapter.sh" \
            --required test-fixtures/ci_required.txt \
            --json-out fixture-results.json

      - name: Upload fixture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-results
          path: fixture-results.json
          if-no-files-found: ignore
